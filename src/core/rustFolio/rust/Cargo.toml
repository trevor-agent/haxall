[package]
name = "rust-folio"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-folio"
path = "src/main.rs"

[dependencies]
redb = "2"
chrono = "0.4"
chrono-tz = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "filter_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "proto_bench"
harness = false

[[bench]]
name = "storage_bench"
harness = false
